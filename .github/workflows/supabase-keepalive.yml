name: Supabase keep-alive

# Free-tier Supabase projects are paused after 7 days without activity.
# A lightweight weekly read through PostgREST keeps the project awake.
on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Same key as the app build; SUPABASE_ANON_KEY is accepted as an alternative name.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY (or SUPABASE_ANON_KEY) secrets must be set"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/players?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"

  # GitHub disables scheduled workflows after 60 days without repository activity.
  # Re-enabling the workflow through the API resets that timer (no dummy commits,
  # no third-party action).
  workflow-keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
